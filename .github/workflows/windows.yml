name: Windows checks and setup
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Rust checks
        working-directory: src-tauri
        run: cargo test --locked --lib
      - name: Install audit and Tauri CLI
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo install tauri-cli --version 2.12.1 --locked
      - name: Audit dependencies
        working-directory: src-tauri
        run: cargo audit --file Cargo.lock
      - name: Build setup
        working-directory: src-tauri
        run: cargo tauri build --bundles nsis -- --locked
      - name: UI smoke check
        shell: pwsh
        run: |
          $app = Start-Process -FilePath './src-tauri/target/release/am8-lab.exe' -ArgumentList '--smoke-test' -PassThru
          if (-not $app.WaitForExit(30000) -or $app.ExitCode -ne 0) { throw 'UI smoke failed' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: AM8-Lab-Windows
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
